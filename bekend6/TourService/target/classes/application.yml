server:
  port: 8080

spring:
  application:
    name: tour-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/tour_db}
  jackson:
    serialization:
      write-dates-as-timestamps: false

tour:
  internal-api-key: ${TOUR_INTERNAL_API_KEY:tour-service-internal-dev-key}
