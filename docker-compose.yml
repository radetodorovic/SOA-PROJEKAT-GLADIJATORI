services:
  stakeholders-db:
    image: postgres:16
    container_name: stakeholders-db
    environment:
      POSTGRES_DB: stakeholders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - stakeholders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stakeholders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soa-network

  stakeholders-service:
    build:
      context: ./bekend6/StakeholdersService
    image: stakeholders-service
    container_name: stakeholders-service
    depends_on:
      stakeholders-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=stakeholders-db;Port=5432;Database=stakeholders_db;Username=postgres;Password=root
      OpenTelemetry__ServiceName: stakeholders-service
      OpenTelemetry__OtlpEndpoint: http://jaeger:4317
    ports:
      - "5008:8080"
    restart: on-failure
    networks:
      - soa-network


  blog-db:
    image: postgres:16
    container_name: blog-db
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - blog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soa-network

  blog-service:
    build:
      context: ./bekend6/BlogService
    image: blog-service
    container_name: blog-service
    depends_on:
      blog-db:
        condition: service_healthy
      follower-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=blog-db;Port=5432;Database=blog_db;Username=postgres;Password=root
      FollowerService__BaseUrl: http://follower-service:8080
    ports:
      - "5009:8080"
    restart: on-failure
    networks:
      - soa-network

  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - soa-network

  follower-service:
    build:
      context: ./bekend6/FollowerService
    image: follower-service
    container_name: follower-service
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      PORT: 8080
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    ports:
      - "5010:8080"
    restart: on-failure
    networks:
      - soa-network

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: tour_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - soa-network

  tour-service:
    build:
      context: ./bekend6/TourService
    image: tour-service
    container_name: tour-service
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/tour_db
      GRPC_SERVER_PORT: 9090
    ports:
      - "5011:8080"
      - "5012:9090"
    restart: on-failure
    networks:
      - soa-network

  api-gateway:
    build:
      context: ./bekend6/ApiGateway
    image: api-gateway
    container_name: api-gateway
    depends_on:
      stakeholders-service:
        condition: service_started
      blog-service:
        condition: service_started
      follower-service:
        condition: service_started
      tour-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Services__StakeholdersService__BaseUrl: http://stakeholders-service:8080
      Services__BlogService__BaseUrl: http://blog-service:8080
      Services__FollowerService__BaseUrl: http://follower-service:8080
      Services__TourService__BaseUrl: http://tour-service:8080
      Services__TourService__GrpcUrl: http://tour-service:9090
      OpenTelemetry__ServiceName: api-gateway
      OpenTelemetry__OtlpEndpoint: http://jaeger:4317
    ports:
      - "5000:8080"
    restart: on-failure
    networks:
      - soa-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - soa-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    networks:
      - soa-network

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - soa-network

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - soa-network

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    restart: unless-stopped
    networks:
      - soa-network

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - soa-network

  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - soa-network

volumes:
  stakeholders-db-data:
  blog-db-data:
  neo4j-data:
  neo4j-logs:
  mongodb-data:
  prometheus-data:
  loki-data:
  promtail-data:
  grafana-data:

networks:
  soa-network:
    driver: bridge
